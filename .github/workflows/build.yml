name: Build and Release Masterbay

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download FFmpeg (Gyan build, full)
        shell: bash
        run: |
          curl -L -o ffmpeg.zip "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z"
          7z x ffmpeg.zip -obin_extract -y
          # Copy ffmpeg.exe and ffprobe.exe into electron/bin (used by electron-builder extraResources)
          mkdir -p electron/bin bin
          cp bin_extract/ffmpeg-*/bin/ffmpeg.exe electron/bin/ffmpeg.exe
          cp bin_extract/ffmpeg-*/bin/ffprobe.exe electron/bin/ffprobe.exe
          cp electron/bin/ffmpeg.exe bin/ffmpeg.exe
          cp electron/bin/ffprobe.exe bin/ffprobe.exe
          ls -la electron/bin/

      - name: Run integrity build
        run: npm run build:integrity

      - name: Build NSIS installer
        run: npm run electron:build

      - name: Rename NSIS to documented name
        shell: bash
        run: |
          mv "dist/Masterbay-1.0.0-win-x64.exe" "dist/Masterbay-Setup-1.0.0-win-x64.exe"
          mv "dist/Masterbay-1.0.0-win-x64.exe.blockmap" "dist/Masterbay-Setup-1.0.0-win-x64.exe.blockmap" || true

      - name: Build portable
        run: npm run electron:build:portable

      - name: Rename portable to documented name
        shell: bash
        run: |
          mv "dist/Masterbay-1.0.0-win-x64.exe" "dist/Masterbay-Portable-1.0.0-win-x64.exe" || true

      - name: Verify builds
        shell: bash
        run: |
          ls -la dist/
          test -f "dist/Masterbay-Setup-1.0.0-win-x64.exe" && echo "Installer found"
          test -f "dist/Masterbay-Portable-1.0.0-win-x64.exe" && echo "Portable found"

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          : > SHA256SUMS.txt
          for file in *.exe; do
            hash=$(certutil -hashfile "$file" SHA256 | sed -n '2p')
            echo "$hash  $file" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Masterbay ${{ github.ref_name }}
          body: |
            ## Masterbay ${{ github.ref_name }}

            ### Downloads
            - **Installer (NSIS):** `Masterbay-Setup-1.0.0-win-x64.exe` — standard install with desktop/start-menu shortcuts
            - **Portable:** `Masterbay-Portable-1.0.0-win-x64.exe` — no admin, runs from any folder

            ### Verification
            SHA256 checksums in `SHA256SUMS.txt`. Verify with:
            ```
            certutil -hashfile Masterbay-Setup-1.0.0-win-x64.exe SHA256
            ```

            ### Note on SmartScreen
            The binaries are **unsigned** (no paid code-signing certificate). Windows SmartScreen may show a warning on first run. Click "More info" → "Run anyway". A false-positive submission has been filed with Microsoft.

            ### License
            Requires a valid license key. Contact the author or use your deployed Cloudflare Worker.
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Worker
        run: |
          cd src
          wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
