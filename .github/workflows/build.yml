name: Build and Release Masterbay

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download FFmpeg (Gyan build, full)
        shell: bash
        run: |
          curl -L -o ffmpeg.7z "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z"
          7z x ffmpeg.7z -obin_extract -y
          mkdir -p electron/bin bin
          cp bin_extract/ffmpeg-*/bin/ffmpeg.exe electron/bin/ffmpeg.exe
          cp bin_extract/ffmpeg-*/bin/ffprobe.exe electron/bin/ffprobe.exe
          cp electron/bin/ffmpeg.exe bin/ffmpeg.exe
          cp electron/bin/ffprobe.exe bin/ffprobe.exe
          ls -la electron/bin/

      - name: Run integrity build
        run: npm run build:integrity

      - name: Build NSIS installer
        run: npm run electron:build

      - name: Rename NSIS artifact
        shell: bash
        run: |
          cd dist
          if [ -f "Masterbay-1.0.0-win-x64.exe" ]; then
            mv "Masterbay-1.0.0-win-x64.exe" "Masterbay-Setup-1.0.0-win-x64.exe"
          fi
          if [ -f "Masterbay-1.0.0-win-x64.exe.blockmap" ]; then
            mv "Masterbay-1.0.0-win-x64.exe.blockmap" "Masterbay-Setup-1.0.0-win-x64.exe.blockmap"
          fi

      - name: Build portable
        run: npm run electron:build:portable

      - name: Rename portable artifact
        shell: bash
        run: |
          cd dist
          if [ -f "Masterbay-1.0.0-win-x64.exe" ]; then
            mv "Masterbay-1.0.0-win-x64.exe" "Masterbay-Portable-1.0.0-win-x64.exe"
          fi
          ls -la

      - name: Verify builds
        shell: bash
        run: |
          cd dist
          test -f "Masterbay-Setup-1.0.0-win-x64.exe" && echo "Installer found" || echo "INSTALLER MISSING"
          ls -la *.exe 2>/dev/null

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          : > SHA256SUMS.txt
          for file in *.exe; do
            hash=$(certutil -hashfile "$file" SHA256 | sed -n '2p')
            echo "$hash  $file" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Masterbay ${{ github.ref_name }}
          body: |
            ## Masterbay ${{ github.ref_name }}

            ### Downloads
            - **Installer (NSIS):** `Masterbay-Setup-1.0.0-win-x64.exe`
            - **Portable:** `Masterbay-Portable-1.0.0-win-x64.exe`

            ### Verification
            SHA256 checksums in `SHA256SUMS.txt`. Verify with:
            ```
            certutil -hashfile Masterbay-Setup-1.0.0-win-x64.exe SHA256
            ```

            ### Note on SmartScreen
            Binaries are **unsigned** (no paid code-signing). Click "More info" → "Run anyway".
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Worker
        run: |
          cd src
          wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
